name: test-container

on:
  pull_request:

jobs:
  test-build:
    uses: eds-book/notebooks-workflows/.github/workflows/test.yaml@main

  # The shared workflow intentionally skips repos outside eds-book.
  # Run our source/provenance invariants in the author's preparation repo.
  validate-standalone:
    if: github.repository_owner != 'eds-book'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the preparation branch
        uses: actions/checkout@v4
      - name: Select Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline GBIF provenance and grid tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

  # Validate the actual notebook, not just helpers, without accessing mutable GBIF.
  execute-offline-notebook:
    if: github.repository_owner != 'eds-book'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out teaching notebook
        uses: actions/checkout@v4
      - name: Select Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned notebook runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 matplotlib==3.9.4 pyproj==3.7.1 \
            nbclient==0.10.2 "nbformat>=5,<6" "ipykernel>=6,<7"
      - name: Execute all four code cells against offline snapshot
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          book = nbformat.read("notebook.ipynb", as_version=4)
          code = [c for c in book.cells if c.cell_type == "code"]
          assert len(code) == 4, "Unexpected notebook code-cell count"
          assert "LIVE_GBIF = False" in code[0].source
          assert "LIVE_GBIF = True" not in code[0].source
          executed = NotebookClient(
              book, timeout=120, kernel_name="python3",
              resources={"metadata": {"path": "."}},
          ).execute()
          streams = "\n".join(
              o.get("text", "") for cell in executed.cells
              if cell.cell_type == "code"
              for o in cell.get("outputs", []) if o.get("output_type") == "stream"
          )
          assert "FROZEN screened records: 50" in streams, streams
          assert ("10-km occupied cells: 12 50-km occupied cells: 8 "
                  "screened records: 50") in streams, streams
          print("PASS: notebook executed 4/4 code cells offline; "
                "50 filtered records; 12 vs 8 occupied cells.")
          print("No full GBIF occurrence-download DOI or Binder acceptance claimed.")
          PY
